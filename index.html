<style>

* {
    box-sizing: border-box;
    font-family: "Courier New", monospace;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center, #1b2735 0%, #05070b 70%);

    color: #d6ffd9;
}


/* Fog */

body::before,
body::after {

    content: "";

    position: fixed;

    width: 200%;
    height: 200%;

    background:
        radial-gradient(
            ellipse,
            rgba(180,220,220,0.12),
            transparent 60%
        );

    animation: fog 18s linear infinite;

    pointer-events: none;
}

body::after {

    animation-duration: 30s;
    animation-direction: reverse;
    opacity: .5;
}


@keyframes fog {

    from {
        transform: translate(-20%, -10%);
    }

    to {
        transform: translate(20%, 10%);
    }

}


.container {

    position: relative;
    z-index: 2;

    width: 600px;

    margin: 40px 20px;
    padding: 45px;

    border-radius: 20px;

    background:
        rgba(5,12,18,.78);

    backdrop-filter: blur(12px);

    border: 1px solid rgba(150,255,200,.15);

    box-shadow:
        0 0 40px rgba(0,255,150,.15);

    text-align: center;
}


h1 {

    color: #baffc9;

    letter-spacing: 4px;

    text-shadow:
        0 0 15px #00ff88;
}


p {

    color: #839b8c;

}


input {

    width: 100%;

    padding: 15px;

    margin-top: 20px;

    background: #020605;

    color: #baffc9;

    border-radius: 10px;

    border: 1px solid rgba(150,255,200,.2);

    outline: none;

    font-size: 18px;
}


input:focus {

    box-shadow:
        0 0 15px rgba(0,255,136,.3);

}


button {

    width: 100%;

    margin-top: 20px;

    padding: 15px;

    cursor: pointer;

    background: transparent;

    color: #00ff88;

    border: 1px solid #00ff88;

    border-radius: 10px;

    font-size: 18px;

    transition: .3s;
}


button:hover {

    background: #00ff88;

    color: #000;

    box-shadow:
        0 0 25px rgba(0,255,136,.5);

}


.response {

    margin-top: 25px;

    padding: 20px;

    min-height: 90px;

    border-radius: 12px;

    background: rgba(0,0,0,.6);

    opacity: 0;

    transition: .4s;

}


.response.show {

    opacity: 1;

}


.success {

    color: #9affb5;

    font-size: 26px;

    display: block;

    margin-bottom: 20px;

    text-shadow:
        0 0 15px #00ff88;

}


/* Obraz 500x500 */

.result-image {

    margin-top: 10px;

    width: 500px;

    height: 500px;

    object-fit: contain;

    border-radius: 14px;

    border: 1px solid rgba(150,255,200,.25);

    box-shadow:
        0 0 35px rgba(0,255,150,.3);

    max-width: 100%;

}

</style>

</head>
